# Qwenomatic fitness configuration (DESIGN §9).
#
# Versioned and frozen at generation start (invariant I4): the evaluator
# scores a generation with the snapshot recorded in its GENERATION_STARTED
# event, never with this file as edited mid-window.

version: 1

# Objective: expected incremental net realized profit per unit of scarce
# resource (GPU-hours), shrunk toward a prior and adjusted for confidence.
objective: net_profit_per_gpu_hour

# Imputed costs that make results comparable across agents.
imputed_costs:
  local_compute_usd_per_gpu_hour: 0.60   # power + depreciation for one RTX 5080
  human_intervention_usd: 15.0           # per recorded intervention

# Delayed but independently validated milestones may count toward fitness at
# this weight. Milestones come only from trusted adapters.
milestone_weight: 0.5

posterior:
  prior_mean_per_step: 0.0
  prior_strength_steps: 10
  variance_floor: 0.25

# Width of the confidence bounds (mean +/- risk_aversion * sd). Elites are
# ranked by the lower bound, retirement by the upper bound, parents by the mean.
risk_aversion: 1.0

min_exposure_steps: 20

# Archetype-specific evaluation windows: long-cycle strategies are evaluated
# over several generations and cannot be retired before min_age_generations.
archetypes:
  standard:   {window_generations: 1, min_age_generations: 0}
  long_cycle: {window_generations: 3, min_age_generations: 2}
