[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwenomatic"
version = "0.1.0"
description = "Local-first evolutionary agent farm with an independent supervisor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "cryptography>=46.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qwenomatic = "supervisor.cli:main"

[tool.setuptools.packages.find]
include = ["supervisor*", "runtime*", "storage*", "dashboard*", "broker*"]

[tool.setuptools.package-data]
storage = ["migrations/*.sql"]
dashboard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
